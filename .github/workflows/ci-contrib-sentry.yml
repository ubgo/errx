# Manual only (owner's call, 2026-10-13: Actions minutes are a budget). To run automatically again, replace the on: block with:
#   on:
#     push:
#       branches: [main]
#       paths: ["contrib/sentry/**", "*.go", "go.mod"]
#     pull_request:
#       paths: ["contrib/sentry/**", "*.go", "go.mod"]

name: CI contrib/sentry

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: contrib/sentry

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: |
          out=$(gofmt -l -s .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./... -race -count=1
